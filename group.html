<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group — MeraShare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="topbar">
  <span class="brand">💸 MeraShare</span>
  <a class="home-btn" href="dashboard.html">Home</a>
</div>
<div class="container">
  <div class="card">
    <h1 id="groupName">Loading...</h1>
    <div class="invite-box">
      <div class="muted">Invite code</div>
      <div class="invite-code" id="inviteCode">—</div>
      <button class="btn-secondary" id="copyInviteBtn" style="margin-top:8px;">Copy</button>
    </div>
  </div>

  <div class="card">
    <h2>Photos</h2>
    <div class="photo-strip" id="photoStrip"><p class="muted">Loading...</p></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
    <button type="button" class="btn-secondary btn-block" id="addPhotoBtn" style="margin-top:10px;">+ Add Photo</button>
    <div class="error-box" id="photoError"></div>
  </div>

  <div class="card">
    <h2>Balances</h2>
    <div id="balancesList"><p class="muted">Loading...</p></div>
  </div>

  <div class="row">
    <a class="btn" id="addExpenseBtn" href="#">+ Add Expense</a>
    <a class="btn btn-secondary" id="settleBtn" href="#">Settle Up</a>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>Expenses</h2>
    <p class="muted" id="expenseTotal" style="margin:-4px 0 10px;"></p>
    <div id="expenseList"><p class="muted">Loading...</p></div>
  </div>

  <div class="card">
    <h2>Members</h2>
    <div id="membersList"><p class="muted">Loading...</p></div>
    <form id="addMemberForm" style="margin-top:12px;">
      <label for="memberEmail">Add member by email</label>
      <input type="email" id="memberEmail" required placeholder="friend@example.com">
      <label for="memberName">Their name</label>
      <input type="text" id="memberName" required placeholder="e.g. Rahul">
      <button type="submit" class="btn-secondary btn-block">Add to group</button>
      <div class="error-box" id="addMemberError"></div>
    </form>
  </div>

  <p class="support-line">Questions? <a href="mailto:info.anyapps@gmail.com">info.anyapps@gmail.com</a></p>
  <p class="powered-by">Powered by <a href="https://anyapps.in" target="_blank" rel="noopener" class="anyapps-badge">Any<span class="accent">Apps</span>.in</a></p>
</div>

<script src="js/supabase-client.js"></script>
<script>
const groupId = new URLSearchParams(window.location.search).get('id');
let members = [];

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

async function init() {
  const session = await requireSession('login.html');
  if (!session) return;
  if (!groupId) { window.location.href = 'dashboard.html'; return; }

  document.getElementById('addExpenseBtn').href = 'add-expense.html?group=' + groupId;
  document.getElementById('settleBtn').href = 'settle.html?group=' + groupId;

  await loadGroup();
  await loadMembers();
  await loadBalances();
  await loadExpenses();
  await loadPhotos();
}

function photoPublicUrl(path) {
  return supabaseClient.storage.from('ms-trip-photos').getPublicUrl(path).data.publicUrl;
}

async function loadPhotos() {
  const el = document.getElementById('photoStrip');
  const { data, error } = await supabaseClient
    .from('ms_trip_photos')
    .select('*')
    .eq('group_id', groupId)
    .order('created_at', { ascending: false });

  if (error) { el.innerHTML = '<p class="muted">Could not load photos.</p>'; return; }
  if (!data || data.length === 0) { el.innerHTML = '<p class="muted">No photos yet. Add the first one below.</p>'; return; }

  const { data: user } = await supabaseClient.auth.getUser();
  const myUserId = user.user.id;

  el.innerHTML = data.map(p => {
    const canDelete = p.uploaded_by === myUserId;
    return '<div class="photo-thumb">' +
      '<img src="' + photoPublicUrl(p.storage_path) + '" loading="lazy">' +
      (canDelete ? '<a href="#" class="photo-delete" onclick="deletePhoto(\'' + p.id + '\',\'' + p.storage_path + '\');return false;">✕</a>' : '') +
      '</div>';
  }).join('');
}

document.getElementById('addPhotoBtn').addEventListener('click', () => {
  document.getElementById('photoInput').click();
});

document.getElementById('photoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const errorBox = document.getElementById('photoError');
  errorBox.style.display = 'none';

  if (!file.type.startsWith('image/')) {
    showError(errorBox, { message: 'Please choose an image file.' });
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    showError(errorBox, { message: 'Image is too large (max 8MB).' });
    return;
  }

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = groupId + '/' + crypto.randomUUID() + '.' + ext;

  const { error: uploadErr } = await supabaseClient.storage.from('ms-trip-photos').upload(path, file);
  if (uploadErr) { showError(errorBox, uploadErr); return; }

  const { error: rpcErr } = await supabaseClient.rpc('ms_add_trip_photo', { p_group_id: groupId, p_storage_path: path });
  if (rpcErr) { showError(errorBox, rpcErr); return; }

  await loadPhotos();
});

async function deletePhoto(id, path) {
  if (!confirm('Delete this photo?')) return;
  await supabaseClient.storage.from('ms-trip-photos').remove([path]);
  const { error } = await supabaseClient.rpc('ms_delete_trip_photo', { p_photo_id: id });
  if (error) { alert(error.message); return; }
  await loadPhotos();
}

async function loadGroup() {
  const { data, error } = await supabaseClient.from('ms_groups').select('*').eq('id', groupId).single();
  if (error || !data) { window.location.href = 'dashboard.html'; return; }
  document.getElementById('groupName').textContent = data.name;
  document.getElementById('inviteCode').textContent = data.invite_code;
}

async function loadMembers() {
  const { data } = await supabaseClient.from('ms_group_members').select('*').eq('group_id', groupId);
  members = data || [];
  const el = document.getElementById('membersList');
  if (members.length === 0) { el.innerHTML = '<p class="muted">No members.</p>'; return; }
  el.innerHTML = members.map(m =>
    '<div class="member-row"><span>' + escapeHtml(m.display_name) + '</span>' +
    '<span class="muted">' + (m.user_id ? 'joined' : 'invited') + '</span></div>'
  ).join('');
}

async function loadBalances() {
  const { data, error } = await supabaseClient.rpc('ms_pairwise_balances', { p_group_id: groupId });
  const el = document.getElementById('balancesList');
  if (error || !data) { el.innerHTML = '<p class="muted">Could not load balances.</p>'; return; }

  if (data.length === 0) {
    el.innerHTML = '<p class="muted">No one else in this group yet.</p>';
    return;
  }

  const total = data.reduce((s, b) => s + Number(b.amount), 0);
  let totalCls = 'amount-even', totalText = "You're all settled up";
  if (total > 0.005) { totalCls = 'amount-owed'; totalText = 'Overall, you are owed ₹' + total.toFixed(2); }
  else if (total < -0.005) { totalCls = 'amount-owe'; totalText = 'Overall, you owe ₹' + Math.abs(total).toFixed(2); }

  const rows = data.map(b => {
    const amt = Number(b.amount);
    let cls = 'amount-even', text = 'settled up';
    if (amt > 0.005) { cls = 'amount-owed'; text = 'owes you ₹' + amt.toFixed(2); }
    else if (amt < -0.005) { cls = 'amount-owe'; text = 'you owe ₹' + Math.abs(amt).toFixed(2); }
    return '<div class="balance-row"><span>' + escapeHtml(b.other_display_name) + '</span><span class="' + cls + '">' + text + '</span></div>';
  }).join('');

  el.innerHTML = '<p class="' + totalCls + '" style="margin:0 0 10px;font-weight:600;">' + totalText + '</p>' + rows;
}

async function loadExpenses() {
  const { data: expenses, error } = await supabaseClient
    .from('ms_expenses')
    .select('*')
    .eq('group_id', groupId)
    .order('created_at', { ascending: false });

  const el = document.getElementById('expenseList');
  const totalEl = document.getElementById('expenseTotal');

  if (error || !expenses || expenses.length === 0) {
    el.innerHTML = '<div class="empty-state">No expenses yet. Add the first one above.</div>';
    totalEl.textContent = '';
    return;
  }

  const grandTotal = expenses.reduce((s, e) => s + Number(e.amount), 0);
  totalEl.textContent = 'Total spent on this trip (everyone combined, regardless of who paid or who it was split with): ₹' + grandTotal.toFixed(2);

  const memberById = {};
  members.forEach(m => memberById[m.id] = m.display_name);
  const { data: user } = await supabaseClient.auth.getUser();
  const myUserId = user.user.id;

  el.innerHTML = expenses.map(e => {
    const payer = memberById[e.paid_by_member] || '?';
    const canEdit = e.created_by === myUserId;
    const refLine = e.reference_note ? '<br><span class="muted">Ref: ' + escapeHtml(e.reference_note) + '</span>' : '';
    const fxLine = (e.currency && e.currency !== 'INR' && e.foreign_amount != null)
      ? '<br><span class="muted">' + Number(e.foreign_amount).toFixed(2) + ' ' + escapeHtml(e.currency) + ' @ ' + Number(e.fx_rate).toFixed(4) + '</span>'
      : '';
    const receiptTick = e.receipt_path
      ? ' <a href="' + photoPublicUrl(e.receipt_path) + '" target="_blank" rel="noopener" title="View bill photo" style="text-decoration:none;">📎✅</a>'
      : '';
    return '<div class="expense-row">' +
      '<span>' + escapeHtml(e.description) + receiptTick + '<br><span class="muted">paid by ' + escapeHtml(payer) + '</span>' + refLine + fxLine + '</span>' +
      '<span>₹' + Number(e.amount).toFixed(2) +
      (canEdit ?
        ' <a href="add-expense.html?group=' + groupId + '&expense=' + e.id + '" class="muted" style="margin-left:8px;">✎ Edit</a>' +
        ' <a href="#" class="muted" onclick="deleteExpense(\'' + e.id + '\');return false;" style="margin-left:8px;">✕ Delete</a>'
        : '') +
      '</span></div>';
  }).join('');
}

async function deleteExpense(id) {
  if (!confirm('Permanently delete this expense?\n\nThis will reverse its effect on every balance it was part of. If you just want to correct a mistake, use Edit instead — this cannot be undone.')) return;
  const { error } = await supabaseClient.rpc('ms_delete_expense', { p_expense_id: id });
  if (error) { alert(error.message); return; }
  await loadBalances();
  await loadExpenses();
}

document.getElementById('copyInviteBtn').addEventListener('click', () => {
  const code = document.getElementById('inviteCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyInviteBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
});

document.getElementById('addMemberForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('addMemberError');
  errorBox.style.display = 'none';
  const email = document.getElementById('memberEmail').value.trim();
  const name = document.getElementById('memberName').value.trim();

  const { error } = await supabaseClient.rpc('ms_add_member', { p_group_id: groupId, p_email: email, p_display_name: name });
  if (error) { showError(errorBox, error); return; }
  document.getElementById('addMemberForm').reset();
  await loadMembers();
  await loadBalances();
});

init();
</script>
</body>
</html>
