<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trips — MeraShare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="has-tabs">
<div class="topbar">
  <span class="brand"><svg class="brand-mark" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="60" cy="32" r="20" fill="#f59e0b"/><circle cx="140" cy="18" r="20" fill="#fbbf24"/><circle cx="220" cy="32" r="20" fill="#34d399"/><text x="60" y="33" text-anchor="middle" dominant-baseline="central" font-size="22">😀</text><text x="140" y="19" text-anchor="middle" dominant-baseline="central" font-size="22">😊</text><text x="220" y="33" text-anchor="middle" dominant-baseline="central" font-size="22">😎</text><rect x="88" y="85" width="104" height="100" rx="10" fill="#ffffff"/><rect x="88" y="85" width="104" height="100" rx="10" fill="none" stroke="#0b5a54" stroke-width="3"/><rect x="102" y="102" width="76" height="8" rx="4" fill="#99f6e4"/><rect x="102" y="120" width="56" height="8" rx="4" fill="#99f6e4"/><rect x="102" y="138" width="66" height="8" rx="4" fill="#99f6e4"/><text x="140" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#0b5a54">₹</text></svg> MeraShare</span>
  <a href="#" id="logoutLink" class="home-btn">Logout</a>
</div>
<div class="container">
  <div class="card">
    <h1>Select a Trip</h1>
    <p class="muted">Pick a trip to view its expenses, balances and settle up.</p>
    <div id="tripsList"><p class="muted">Loading...</p></div>
  </div>
  <p class="powered-by">Powered by <a href="https://anyapps.in" target="_blank" rel="noopener" class="anyapps-badge">Any<span class="accent">Apps</span>.in</a></p>
</div>

<nav class="bottom-tabs">
  <a href="dashboard.html"><span class="tab-icon">🏘️</span>Group</a>
  <a href="trips.html" class="active"><span class="tab-icon">🧳</span>Trip</a>
  <a href="activity.html"><span class="tab-icon">🕒</span>Activity</a>
  <a href="account.html"><span class="tab-icon">👤</span>Account</a>
</nav>

<script src="js/supabase-client.js"></script>
<script>
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function init() {
  const session = await requireSession('login.html');
  if (!session) return;

  const listEl = document.getElementById('tripsList');
  const { data, error } = await supabaseClient.rpc('ms_my_groups_summary');

  if (error) {
    listEl.innerHTML = '<p class="muted">Could not load trips.</p>';
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No trips yet. Create or join one from the Group tab.</div>';
    return;
  }

  const groupIds = data.map(g => g.group_id);
  const { data: photos } = await supabaseClient
    .from('ms_trip_photos')
    .select('group_id, storage_path')
    .in('group_id', groupIds)
    .order('created_at', { ascending: false });

  const coverByGroup = {};
  (photos || []).forEach(p => {
    if (!coverByGroup[p.group_id]) coverByGroup[p.group_id] = p.storage_path;
  });

  listEl.innerHTML = data.map(g => {
    const sym = currencySymbol(g.base_currency);
    const bal = Number(g.my_net_balance);
    let balClass = 'amount-even', balText = 'all settled';
    if (bal > 0.005) { balClass = 'amount-owed'; balText = 'you are owed ' + sym + bal.toFixed(2); }
    else if (bal < -0.005) { balClass = 'amount-owe'; balText = 'you owe ' + sym + Math.abs(bal).toFixed(2); }
    const cover = coverByGroup[g.group_id];
    const thumb = cover
      ? '<img class="trip-thumb" src="' + supabaseClient.storage.from('ms-trip-photos').getPublicUrl(cover).data.publicUrl + '">'
      : '<span class="trip-thumb" style="display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:1.3rem;">🧳</span>';
    return '<a class="group-item" href="group.html?id=' + g.group_id + '">' +
      '<span style="display:flex;align-items:center;gap:10px;">' + thumb + escapeHtml(g.name) + '</span>' +
      '<span class="' + balClass + '">' + balText + '</span>' +
      '</a>';
  }).join('');
}

wireLogoutLink();
init();
</script>
</body>
</html>
