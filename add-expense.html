<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Add Expense — MeraShare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="topbar">
  <span class="brand">💸 MeraShare</span>
  <a class="home-btn" id="backBtn" href="#">Back</a>
</div>
<div class="container">
  <div class="card">
    <h1 id="formHeading">Add Expense</h1>
    <form id="expenseForm">
      <label for="description">Description</label>
      <input type="text" id="description" required placeholder="e.g. Dinner, Cab, Groceries">

      <label for="currency">Currency</label>
      <select id="currency">
        <option value="INR" selected>₹ INR — Indian Rupee</option>
        <option value="AED">AED — UAE Dirham</option>
        <option value="USD">USD — US Dollar</option>
        <option value="EUR">EUR — Euro</option>
        <option value="GBP">GBP — British Pound</option>
        <option value="SGD">SGD — Singapore Dollar</option>
        <option value="THB">THB — Thai Baht</option>
        <option value="NPR">NPR — Nepalese Rupee</option>
        <option value="other">Other…</option>
      </select>
      <input type="text" id="currencyOther" placeholder="e.g. JPY, MYR" style="display:none;margin-top:6px;">

      <label for="amount" id="amountLabel">Amount (₹)</label>
      <input type="number" id="amount" required min="0.01" step="0.01">

      <div id="fxRow" style="display:none;">
        <label for="fxRate">Conversion rate (1 <span id="fxCurLabel">—</span> = how many ₹?)</label>
        <input type="number" id="fxRate" step="0.0001" min="0.0001" placeholder="e.g. 22.50">
        <p class="muted" id="fxPreview" style="margin:4px 0 0;"></p>
      </div>

      <label for="referenceNote">Reference / Bill no. <span class="muted">(optional)</span></label>
      <input type="text" id="referenceNote" placeholder="e.g. Bill #1234, UPI ref">

      <label for="category">Category</label>
      <select id="category">
        <option value="general">General</option>
        <option value="food">Food</option>
        <option value="transport">Transport</option>
        <option value="accommodation">Accommodation</option>
        <option value="shopping">Shopping</option>
        <option value="entertainment">Entertainment</option>
        <option value="other">Other</option>
      </select>

      <label for="paidBy">Paid by</label>
      <select id="paidBy"></select>

      <label>Split</label>
      <p class="muted" style="margin:4px 0 0;">Uncheck anyone who isn't part of this particular expense — e.g. someone who joined a day late, or skips a non-veg meal.</p>
      <div class="split-type-tabs">
        <button type="button" data-type="equal" class="active">Equal Share</button>
        <button type="button" data-type="exact">Different Amount</button>
        <button type="button" data-type="percentage">Different %</button>
      </div>

      <div id="splitInputs"></div>
      <p class="muted" id="splitStatus"></p>

      <button type="submit" class="btn-block" id="submitBtn">Save Expense</button>
      <div class="error-box" id="errorBox"></div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
const groupId = new URLSearchParams(window.location.search).get('group');
const expenseId = new URLSearchParams(window.location.search).get('expense');
let members = [];
let splitType = 'equal';
let existingSplits = null; // {member_id: share_amount} when editing

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

async function init() {
  const session = await requireSession('login.html');
  if (!session) return;
  if (!groupId) { window.location.href = 'dashboard.html'; return; }
  document.getElementById('backBtn').href = 'group.html?id=' + groupId;

  const { data } = await supabaseClient.from('ms_group_members').select('*').eq('group_id', groupId).order('joined_at');
  members = data || [];

  const paidBySelect = document.getElementById('paidBy');
  paidBySelect.innerHTML = members.map(m => '<option value="' + m.id + '">' + escapeHtml(m.display_name) + '</option>').join('');

  if (expenseId) {
    document.getElementById('pageTitle').textContent = 'Edit Expense — MeraShare';
    document.getElementById('formHeading').textContent = 'Edit Expense';
    document.getElementById('submitBtn').textContent = 'Update Expense';

    const { data: exp, error: expErr } = await supabaseClient.from('ms_expenses').select('*').eq('id', expenseId).single();
    if (expErr || !exp) { window.location.href = 'group.html?id=' + groupId; return; }

    document.getElementById('description').value = exp.description;
    document.getElementById('referenceNote').value = exp.reference_note || '';
    document.getElementById('category').value = exp.category;
    paidBySelect.value = exp.paid_by_member;

    const cur = exp.currency || 'INR';
    if (cur === 'INR') {
      document.getElementById('amount').value = exp.amount;
    } else {
      const presets = ['AED', 'USD', 'EUR', 'GBP', 'SGD', 'THB', 'NPR'];
      const currencySelect = document.getElementById('currency');
      if (presets.includes(cur)) {
        currencySelect.value = cur;
      } else {
        currencySelect.value = 'other';
        document.getElementById('currencyOther').value = cur;
      }
      document.getElementById('amount').value = exp.foreign_amount != null ? exp.foreign_amount : exp.amount;
      document.getElementById('fxRate').value = exp.fx_rate || 1;
      onCurrencyChange();
    }

    const { data: splits } = await supabaseClient.from('ms_expense_splits').select('*').eq('expense_id', expenseId);
    existingSplits = {};
    (splits || []).forEach(s => { existingSplits[s.member_id] = Number(s.share_amount); });

    splitType = 'exact';
    document.querySelectorAll('.split-type-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelector('.split-type-tabs button[data-type="exact"]').classList.add('active');
  }

  renderSplitInputs();
  document.getElementById('amount').addEventListener('input', () => { updateFxPreview(); renderSplitInputs(); });
  document.getElementById('fxRate').addEventListener('input', () => { updateFxPreview(); renderSplitInputs(); });
  document.getElementById('currency').addEventListener('change', onCurrencyChange);
  document.getElementById('currencyOther').addEventListener('input', () => { updateFxPreview(); });
}

function selectedCurrency() {
  const sel = document.getElementById('currency').value;
  if (sel === 'other') {
    return (document.getElementById('currencyOther').value.trim() || 'FOREIGN').toUpperCase();
  }
  return sel;
}

function onCurrencyChange() {
  const sel = document.getElementById('currency').value;
  const isForeign = sel !== 'INR';
  document.getElementById('currencyOther').style.display = sel === 'other' ? 'block' : 'none';
  document.getElementById('fxRow').style.display = isForeign ? 'block' : 'none';
  document.getElementById('amountLabel').textContent = isForeign ? 'Amount (' + selectedCurrency() + ')' : 'Amount (₹)';
  document.getElementById('fxCurLabel').textContent = selectedCurrency();
  updateFxPreview();
  renderSplitInputs();
}

function getForeignAmount() {
  return parseFloat(document.getElementById('amount').value) || 0;
}

function getFxRate() {
  if (document.getElementById('currency').value === 'INR') return 1;
  return parseFloat(document.getElementById('fxRate').value) || 0;
}

function updateFxPreview() {
  const preview = document.getElementById('fxPreview');
  if (document.getElementById('currency').value === 'INR') { preview.textContent = ''; return; }
  const inr = getForeignAmount() * getFxRate();
  preview.textContent = '= ₹' + inr.toFixed(2) + (getFxRate() > 0 ? '' : ' (enter a conversion rate)');
}

document.querySelectorAll('.split-type-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.split-type-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    splitType = btn.dataset.type;
    renderSplitInputs();
  });
});

function getAmount() {
  // INR-equivalent amount -- this is what every split calculation below
  // uses, regardless of which currency was actually typed in.
  if (document.getElementById('currency').value === 'INR') return getForeignAmount();
  return Math.round(getForeignAmount() * getFxRate() * 100) / 100;
}

function renderSplitInputs() {
  const el = document.getElementById('splitInputs');
  const amount = getAmount();
  const n = members.length || 1;

  if (splitType === 'equal') {
    const share = amount / n;
    el.innerHTML = members.map(m =>
      '<div class="split-member-row">' +
      '<label><input type="checkbox" class="eq-check" data-id="' + m.id + '" checked style="width:auto;margin-right:8px;">' + escapeHtml(m.display_name) + '</label>' +
      '<span class="muted eq-share" data-id="' + m.id + '">₹' + share.toFixed(2) + '</span>' +
      '</div>'
    ).join('');
    el.querySelectorAll('.eq-check').forEach(cb => cb.addEventListener('change', updateEqualShares));
    updateEqualShares();
  } else if (splitType === 'exact') {
    const defaultShare = (amount / n).toFixed(2);
    el.innerHTML = members.map(m => {
      const editing = !!existingSplits;
      const hasExisting = editing && Object.prototype.hasOwnProperty.call(existingSplits, m.id);
      const checked = !editing || hasExisting;
      const value = hasExisting ? existingSplits[m.id].toFixed(2) : (editing ? '0.00' : defaultShare);
      return '<div class="split-member-row">' +
        '<label><input type="checkbox" class="exact-check" data-id="' + m.id + '"' + (checked ? ' checked' : '') + ' style="width:auto;margin-right:8px;">' + escapeHtml(m.display_name) + '</label>' +
        '<input type="number" step="0.01" class="exact-input" data-id="' + m.id + '" value="' + value + '"' + (checked ? '' : ' disabled') + '>' +
        '</div>';
    }).join('');
    existingSplits = null; // only used to seed the first render
    el.querySelectorAll('.exact-input').forEach(inp => inp.addEventListener('input', updateSplitStatus));
    el.querySelectorAll('.exact-check').forEach(cb => cb.addEventListener('change', () => toggleRow('exact', cb)));
    updateSplitStatus();
  } else {
    const pct = (100 / n).toFixed(2);
    el.innerHTML = members.map(m =>
      '<div class="split-member-row">' +
      '<label><input type="checkbox" class="pct-check" data-id="' + m.id + '" checked style="width:auto;margin-right:8px;">' + escapeHtml(m.display_name) + '</label>' +
      '<input type="number" step="0.01" class="pct-input" data-id="' + m.id + '" value="' + pct + '">%' +
      '</div>'
    ).join('');
    el.querySelectorAll('.pct-input').forEach(inp => inp.addEventListener('input', updateSplitStatus));
    el.querySelectorAll('.pct-check').forEach(cb => cb.addEventListener('change', () => toggleRow('pct', cb)));
    updateSplitStatus();
  }
}

function toggleRow(kind, checkbox) {
  const id = checkbox.dataset.id;
  const input = document.querySelector('.' + kind + '-input[data-id="' + id + '"]');
  if (!checkbox.checked) {
    input.dataset.prevValue = input.value;
    input.value = 0;
    input.disabled = true;
  } else {
    input.disabled = false;
    input.value = input.dataset.prevValue || input.value;
  }
  updateSplitStatus();
}

function updateEqualShares() {
  const amount = getAmount();
  const included = Array.from(document.querySelectorAll('.eq-check:checked')).map(cb => cb.dataset.id);
  const share = included.length ? amount / included.length : 0;
  document.querySelectorAll('.eq-share').forEach(span => {
    const included_ = included.includes(span.dataset.id);
    span.textContent = included_ ? '₹' + share.toFixed(2) : '—';
  });
  document.getElementById('splitStatus').textContent = included.length + ' of ' + members.length + ' members included.';
}

function updateSplitStatus() {
  const amount = getAmount();
  const statusEl = document.getElementById('splitStatus');
  if (splitType === 'exact') {
    const total = Array.from(document.querySelectorAll('.exact-input')).reduce((s, i) => s + (parseFloat(i.value) || 0), 0);
    const diff = amount - total;
    statusEl.textContent = 'Splits total ₹' + total.toFixed(2) + ' of ₹' + amount.toFixed(2) + (Math.abs(diff) > 0.05 ? ' (off by ₹' + diff.toFixed(2) + ')' : ' ✓');
  } else if (splitType === 'percentage') {
    const total = Array.from(document.querySelectorAll('.pct-input')).reduce((s, i) => s + (parseFloat(i.value) || 0), 0);
    statusEl.textContent = 'Percentages total ' + total.toFixed(2) + '%' + (Math.abs(total - 100) > 0.1 ? ' (should be 100%)' : ' ✓');
  }
}

function buildSplits() {
  const amount = getAmount();
  if (splitType === 'equal') {
    const included = Array.from(document.querySelectorAll('.eq-check:checked')).map(cb => cb.dataset.id);
    const share = amount / included.length;
    return included.map(id => ({ member_id: id, share_amount: share }));
  } else if (splitType === 'exact') {
    return Array.from(document.querySelectorAll('.exact-input')).map(i => ({
      member_id: i.dataset.id, share_amount: parseFloat(i.value) || 0
    }));
  } else {
    return Array.from(document.querySelectorAll('.pct-input')).map(i => ({
      member_id: i.dataset.id, share_amount: amount * (parseFloat(i.value) || 0) / 100
    }));
  }
}

document.getElementById('expenseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';

  const description = document.getElementById('description').value.trim();
  const amount = getAmount();
  const category = document.getElementById('category').value;
  const referenceNote = document.getElementById('referenceNote').value.trim();
  const paidBy = document.getElementById('paidBy').value;
  const splits = buildSplits();
  const currency = selectedCurrency();
  const isForeign = document.getElementById('currency').value !== 'INR';
  const fxRate = getFxRate();
  const foreignAmount = isForeign ? getForeignAmount() : null;

  if (splits.length === 0) {
    showError(errorBox, { message: 'Select at least one member to split with.' });
    return;
  }
  if (isForeign && fxRate <= 0) {
    showError(errorBox, { message: 'Enter a conversion rate for this currency.' });
    return;
  }

  const { error } = expenseId
    ? await supabaseClient.rpc('ms_update_expense', {
        p_expense_id: expenseId,
        p_description: description,
        p_amount: amount,
        p_paid_by_member: paidBy,
        p_category: category,
        p_splits: splits,
        p_reference_note: referenceNote || null,
        p_currency: currency,
        p_fx_rate: fxRate,
        p_foreign_amount: foreignAmount
      })
    : await supabaseClient.rpc('ms_add_expense', {
        p_group_id: groupId,
        p_description: description,
        p_amount: amount,
        p_paid_by_member: paidBy,
        p_category: category,
        p_splits: splits,
        p_reference_note: referenceNote || null,
        p_currency: currency,
        p_fx_rate: fxRate,
        p_foreign_amount: foreignAmount
      });

  if (error) { showError(errorBox, error); return; }
  window.location.href = 'group.html?id=' + groupId;
});

init();
</script>
</body>
</html>
