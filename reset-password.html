<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — MeraShare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="topbar">
  <span class="brand"><svg class="brand-mark" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="60" cy="32" r="20" fill="#f59e0b"/><circle cx="140" cy="18" r="20" fill="#fbbf24"/><circle cx="220" cy="32" r="20" fill="#34d399"/><text x="60" y="33" text-anchor="middle" dominant-baseline="central" font-size="22">😀</text><text x="140" y="19" text-anchor="middle" dominant-baseline="central" font-size="22">😊</text><text x="220" y="33" text-anchor="middle" dominant-baseline="central" font-size="22">😎</text><rect x="88" y="85" width="104" height="100" rx="10" fill="#ffffff"/><rect x="88" y="85" width="104" height="100" rx="10" fill="none" stroke="#0b5a54" stroke-width="3"/><rect x="102" y="102" width="76" height="8" rx="4" fill="#99f6e4"/><rect x="102" y="120" width="56" height="8" rx="4" fill="#99f6e4"/><rect x="102" y="138" width="66" height="8" rx="4" fill="#99f6e4"/><text x="140" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#0b5a54">₹</text></svg> MeraShare</span>
  <a class="home-btn" href="index.html">Home</a>
</div>
<div class="container">
  <div class="card" id="requestCard">
    <h1>Reset password</h1>
    <p class="muted">Enter your email and we'll send you a reset link.</p>
    <form id="requestForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <button type="submit" class="btn-block">Send reset link</button>
      <div class="error-box" id="requestError"></div>
      <div class="success-box" id="requestSuccess" style="display:none;"></div>
    </form>
  </div>

  <div class="card" id="updateCard" style="display:none;">
    <h1>Choose a new password</h1>
    <form id="updateForm">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required minlength="6">
      <button type="submit" class="btn-block">Update password</button>
      <div class="error-box" id="updateError"></div>
      <div class="success-box" id="updateSuccess" style="display:none;"></div>
    </form>
  </div>

  <p class="support-line">Questions? <a href="mailto:info.anyapps@gmail.com">info.anyapps@gmail.com</a></p>
  <p class="powered-by">Powered by <a href="https://anyapps.in" target="_blank" rel="noopener" class="anyapps-badge">Any<span class="accent">Apps</span>.in</a></p>
</div>

<script src="js/supabase-client.js"></script>
<script>
const requestForm = document.getElementById('requestForm');
const updateForm = document.getElementById('updateForm');

// Supabase redirects back here with a recovery session already active in the URL hash.
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('requestCard').style.display = 'none';
    document.getElementById('updateCard').style.display = 'block';
  }
});

requestForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('requestError');
  const successBox = document.getElementById('requestSuccess');
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const { error } = await supabaseClient.auth.resetPasswordForEmail(tagAuthEmail(email), {
    redirectTo: window.location.origin + '/reset-password.html'
  });

  if (error) {
    showError(errorBox, error);
    return;
  }
  successBox.style.display = 'block';
  successBox.textContent = 'If that email has a MeraShare account, a reset link is on its way.';
  requestForm.reset();
});

updateForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('updateError');
  const successBox = document.getElementById('updateSuccess');
  errorBox.style.display = 'none';

  const newPassword = document.getElementById('newPassword').value;
  const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

  if (error) {
    showError(errorBox, error);
    return;
  }
  successBox.style.display = 'block';
  successBox.textContent = 'Password updated. Redirecting...';
  setTimeout(() => window.location.href = 'dashboard.html', 1500);
});
</script>
</body>
</html>
